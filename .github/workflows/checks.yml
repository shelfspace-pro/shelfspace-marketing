name: Page checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: check:sitemap compares lastmod with each page's last commit (Z-A4b); check:claims / check:dupe compare their baselines with HEAD~1 (the ratchet)

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The baselines of check:claims / check:dupe only shrink. Fetch the commit main was at before this push (or
      # the PR base) so a multi-commit push that deletes + re-seeds a baseline is compared with the real "before".
      - name: Fetch baseline ref
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "${BASE//0/}" != "" ]; then
            git fetch --no-tags --depth=1 origin "$BASE" && echo "SEO_BASELINE_REF=$BASE" >> "$GITHUB_ENV" || echo "could not fetch $BASE"
          fi

      # sitemap.xml must equal what scripts/seo/build-sitemap.mjs emits and list every indexable page.
      - name: Sitemap
        run: npm run check:sitemap

      # On-page SEO on every indexable page: title/description/canonical/H1/JSON-LD/FAQ parity/orphans/
      # broken links/alt text. Self-tests each check on fixtures first, then fails on ANY violation
      # (SEO A3a built the fence; A3b fixed the site to zero and removed the baseline).
      - name: On-page SEO
        run: npm run check:seo

      # Speed Insights tag on every page, deferred widget, IndexNow URL mapping + workflow shape (SEO A4).
      - name: Head + IndexNow
        run: npm run check:head

      # Vendored seo-* skills (C1): provenance + MIT license, live links, and the copy law (no retired
      # names, never "collections agency", no partner names, no human-outreach steps, no private paths).
      - name: SEO skills
        run: npm run check:skills

      # Every figure in an article body, "at a glance" box or case-study result strip is in the public registry
      # marketing/seo-claims.json (or grandfathered in a baseline that only shrinks); no ShelfSpace price anywhere
      # outside a trial-ok region (SEO C2).
      - name: Claims registry
        run: npm run check:claims

      # No page shares 60%+ of its 5-word phrases with another page (template families baselined) (SEO C2).
      - name: Duplicate pages
        run: npm run check:dupe
      # SEO C3: tool math (integer cents, MM/DD/YYYY), embeds + framing exception, templates built from
      # their source with the disclaimer, unlisted tutorials noindex, the pricing no-number line.
      - name: Tools, templates, tutorials, pricing line
        run: npm run check:assets

      # SEO E3: the Days-to-Pay Index template (unserved, every slot) + each published Index page (no preview
      # banner, no noindex, a methodology block, CC BY).
      - name: Days-to-Pay Index template and releases
        run: npm run check:index-template

      # Every blog post linked from blog.html + llms.txt; blog.html section counts and ranks 1..n (Z-C1a, Z-E3b).
      - name: Blog index
        run: npm run check:blog-sync

      # ONE footer sitewide, Resources carries "Free tools" -> /tools (Z-C3d).
      - name: Footer
        run: npm run check:footer

      # No provider leaks, no retired pricing; trial copy only inside brand-page trial-ok regions (Z-33).
      - name: Forbidden copy
        run: npm run check:forbidden

      # Homepage videos: public (brand) videos only, current thumbnails (10/29/2026).
      - name: Homepage video strip
        run: npm run check:video-strip

      # /quote is month to month only: a saved 12-month link must open at the month-to-month price.
      - name: Quote builder
        run: npm run check:quote
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # Phones: no link, button or field on a header-nav page runs past the screen edge at 320-430px.
      - name: Phone layout
        run: npm run check:phone
        env:
          CHROME_PATH: /usr/bin/google-chrome
