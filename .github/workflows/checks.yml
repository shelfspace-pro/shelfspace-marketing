name: Page checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # sitemap.xml must equal what scripts/seo/build-sitemap.mjs emits and list every indexable page.
      - name: Sitemap
        run: npm run check:sitemap

      # On-page SEO on every indexable page: title/description/canonical/H1/JSON-LD/FAQ parity/orphans/
      # broken links/alt text. Self-tests each check on fixtures first, then fails on ANY violation
      # (SEO A3a built the fence; A3b fixed the site to zero and removed the baseline).
      - name: On-page SEO
        run: npm run check:seo

      # Speed Insights tag on every page, deferred widget, IndexNow URL mapping + workflow shape (SEO A4).
      - name: Head + IndexNow
        run: npm run check:head

      # Vendored seo-* skills (C1): provenance + MIT license, live links, and the copy law (no retired
      # names, never "collections agency", no partner names, no human-outreach steps, no private paths).
      - name: SEO skills
        run: npm run check:skills

      # No provider leaks, no retired pricing; trial copy only inside brand-page trial-ok regions (Z-33).
      - name: Forbidden copy
        run: npm run check:forbidden

      # Homepage videos: public (brand) videos only, current thumbnails (10/29/2026).
      - name: Homepage video strip
        run: npm run check:video-strip

      # /quote is month to month only: a saved 12-month link must open at the month-to-month price.
      - name: Quote builder
        run: npm run check:quote
        env:
          CHROME_PATH: /usr/bin/google-chrome

      # Phones: no link, button or field on a header-nav page runs past the screen edge at 320-430px.
      - name: Phone layout
        run: npm run check:phone
        env:
          CHROME_PATH: /usr/bin/google-chrome
