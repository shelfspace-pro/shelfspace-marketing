name: GSC Weekly Digest

# Emails a Google Search Console performance summary every Monday.
# Trigger it by hand from the Actions tab (Run workflow) to test.

on:
  schedule:
    - cron: '0 14 * * 1' # Mondays 14:00 UTC
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        working-directory: tools/gsc-digest
        run: npm install --no-audit --no-fund

      - name: Send digest
        working-directory: tools/gsc-digest
        run: node digest.mjs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
